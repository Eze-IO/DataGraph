spring.application.name=DataGraph

# In-memory database, rebuilt from schema.sql and sample data on every start
spring.datasource.url=jdbc:h2:mem:datagraph;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Sample data settings (see SampleDataGenerator)
datagraph.sample.seed=42
datagraph.sample.start-month=2024-10
datagraph.sample.months=24
datagraph.sample.orders-per-month=120
