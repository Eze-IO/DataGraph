spring.application.name=DataGraph

# Spark runs inside the app on all CPU cores. Point this at a cluster
# (e.g. spark://host:7077) to run the queries there instead.
datagraph.spark.master=local[*]
datagraph.spark.shuffle-partitions=2

# Sample data settings (see SampleDataGenerator)
datagraph.sample.seed=42
datagraph.sample.start-month=2024-10
datagraph.sample.months=24

# Spark and Hadoop log every job at INFO; only show warnings and errors
logging.level.org.apache.spark=WARN
logging.level.org.apache.hadoop=WARN
logging.level.org.sparkproject=WARN
