# Default database connection settings.
# To override without rebuilding, put a datagraph.properties file in the folder
# you run the app from, or pass -Ddb.host=... (etc.) on the command line.
# These can also be changed at runtime from the settings (gear) screen.
db.host=localhost
db.port=1433
db.name=master

# Extra JDBC options. Driver versions 10+ encrypt by default; trusting the
# server certificate keeps older/self-signed SQL Servers working.
db.options=encrypt=true;trustServerCertificate=true
