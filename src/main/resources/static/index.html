<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DataGraph</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Served from the Chart.js WebJar in pom.xml -->
    <script src="webjars/chart.js/4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="navbar">
    <a class="brand" href="#">
        <img src="favicon.png" alt="" width="28" height="28">
        <span>DataGraph</span>
    </a>
    <!-- One button per dataset, added by app.js -->
    <nav class="nav-tabs" id="nav" aria-label="Datasets"></nav>
</header>

<main>
    <section class="page-head">
        <div>
            <p class="industry" id="industry"></p>
            <h1 id="title">Loading…</h1>
            <p class="description" id="description"></p>
        </div>
        <label class="filter">
            <span id="filter-label">Filter</span>
            <select id="segment"></select>
        </label>
    </section>

    <section class="kpis" id="kpis" aria-label="Totals"></section>

    <section class="charts">
        <article class="card wide">
            <h2 id="title-trend"></h2>
            <div class="chart-box"><canvas id="chart-trend"></canvas></div>
        </article>
        <article class="card">
            <h2 id="title-segment"></h2>
            <div class="chart-box"><canvas id="chart-segment"></canvas></div>
        </article>
        <article class="card">
            <h2 id="title-group"></h2>
            <div class="chart-box"><canvas id="chart-group"></canvas></div>
        </article>
        <article class="card wide">
            <h2 id="title-top"></h2>
            <div class="chart-box"><canvas id="chart-top"></canvas></div>
        </article>
    </section>

    <p class="error" id="error" hidden></p>
    <p class="note">All numbers are randomly generated sample data. Calculated with Apache Spark.</p>
</main>

<script src="app.js"></script>
</body>
</html>
